<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Die Lage">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<title>Die Lage</title>
<style>
:root{
  --bg:#FFFFFF; --ink:#121212; --ink-2:#363636; --muted:#727272; --rule:#DFDFDF; --rule-dark:#121212;
  --chip:#F7F7F5; --img:#EBEBEB;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Libre Franklin',-apple-system,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212; --ink:#F0F0F0; --ink-2:#CFCFCF; --muted:#9A9A9A; --rule:#333333; --rule-dark:#F0F0F0;
  --chip:#1E1E1E; --img:#262626;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.mast{padding:calc(env(safe-area-inset-top) + 10px) 0 6px;text-align:center}
.mast h1{margin:0;font:700 30px/1.1 var(--serif);letter-spacing:-.01em}
.mast .date{margin-top:4px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-2)}
nav{display:flex;justify-content:center;gap:4px;border-top:1px solid var(--rule)}
nav button{padding:11px 10px;min-height:44px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

main{padding-bottom:56px}

.lead{padding:16px 0 20px;border-bottom:1px solid var(--rule)}
.label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.photo{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--img);margin:0 0 6px}
.credit{font-size:10px;color:var(--muted);text-align:right;margin-bottom:10px;letter-spacing:.02em}
.lead h2{margin:6px 0 8px;font:700 27px/1.15 var(--serif);letter-spacing:-.01em}
.summary{margin:0;font:400 16px/1.45 var(--serif);color:var(--ink-2)}
.byline{margin-top:10px;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
.byline b{color:var(--ink);font-weight:700}

.related{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.related li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.related .src{flex:0 0 92px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.related .txt{font:600 15px/1.35 var(--serif)}
.more{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:4px;font-size:13px;font-weight:700}

.cover{display:flex;align-items:center;gap:8px;margin-top:10px}
.bar{flex:1;height:4px;background:var(--rule);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.cover span{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}

.story{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule);width:100%}
.story .body{flex:1;min-width:0}
.story h3{margin:0 0 6px;font:700 18px/1.22 var(--serif)}
.story p{margin:0;font:400 14px/1.4 var(--serif);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story .thumb{flex:0 0 96px;width:96px;height:96px;object-fit:cover;background:var(--img)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 0;padding:0 0 8px;border-bottom:1px solid var(--rule-dark)}
.sec h2{margin:0;font:700 15px/1.2 var(--sans)}
.sec span{font-size:11px;color:var(--muted)}

.back{display:flex;align-items:center;gap:4px;min-height:44px;font-size:13px;font-weight:600;color:var(--muted)}
.article{padding-bottom:12px}
.article h1{margin:4px 0 10px;font:700 30px/1.13 var(--serif);letter-spacing:-.01em}
.article .dek{margin:0 0 14px;font:400 19px/1.4 var(--serif);color:var(--ink-2)}
.text h3{margin:28px 0 8px;font:700 13px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.text p,.text li{font:400 18px/1.55 var(--serif)}
.text p{margin:0 0 12px}
.text ul{margin:0;padding-left:20px}
.text li{margin:0 0 8px}
.text .who{font:600 12px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.text h3{padding-bottom:8px;border-bottom:1px solid var(--rule-dark);margin-bottom:12px}
.pullnote{margin:18px 0 0;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted)}
.box{background:var(--chip);padding:14px 16px;font-size:14px;color:var(--ink-2);margin-top:8px}
.missing{margin:10px 0 0;font:400 15px/1.6 var(--serif);color:var(--muted)}

.item{border-bottom:1px solid var(--rule)}
.item > summary{list-style:none;cursor:pointer;border-bottom:0}
.item > summary::-webkit-details-marker{display:none}
.item > summary.story{border-bottom:0}
.item .chev{flex:0 0 auto;align-self:center;font-size:18px;color:var(--muted);transition:transform .15s}
.item[open] .chev{transform:rotate(90deg)}
.item[open] > summary .clamp,.item[open] > summary .thumb{display:none}
.expand{padding:0 0 18px}
.expand .photo{margin-bottom:12px}
.expand p{margin:0 0 12px;font:400 18px/1.55 var(--serif)}
.expand .short{font-size:13px;color:var(--muted);margin:0 0 12px}
.readon{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border:1px solid var(--ink);font-size:14px;font-weight:700}
.readon:active{background:var(--chip)}
.searchbar{display:flex;gap:8px;padding:16px 0 4px}
.searchbar input{flex:1;min-width:0;height:46px;padding:0 14px;border:1px solid var(--ink);border-radius:0;background:var(--bg);color:var(--ink);font:400 17px var(--serif);-webkit-appearance:none;appearance:none}
.searchbar input::placeholder{color:var(--muted)}
.searchbar button{height:46px;padding:0 16px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chips button{min-height:36px;padding:0 12px;border:1px solid var(--rule);font-size:13px;font-weight:600}
.summarybox{padding:16px 0 4px}
.summarybox .big{font:700 24px/1.2 var(--serif);margin:0 0 4px}
.outlet{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 0;padding:0 0 6px;border-bottom:1px solid var(--rule-dark)}
.outlet h3{margin:0;font:700 15px/1.2 var(--sans)}
.outlet span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);padding:1px 5px;margin-left:6px;vertical-align:1px}
.morebtn{min-height:44px;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.topiclink{display:block;margin:14px 0 0;padding:12px 14px;background:var(--chip);width:100%}
.topiclink b{display:block;font:700 16px/1.3 var(--serif);margin-top:2px}
.seg{display:flex;border:1px solid var(--ink);margin:14px 0 0}
.seg button{flex:1;min-height:38px;font-size:13px;font-weight:600;text-align:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.time{flex:0 0 44px;font-size:12px;font-weight:600;color:var(--muted);padding-top:3px}

.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14px}
.row small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ok{color:var(--muted)} .bad{color:#C0392B;font-weight:600}
@media (prefers-color-scheme:dark){.bad{color:#F08A7E}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.toggle .name{font:600 17px/1.25 var(--serif)}
.toggle .name.off{color:var(--muted);font-weight:400}
.toggle small{display:block;font:400 12px/1.4 var(--sans);color:var(--muted);margin-top:2px}
.toggle small.bad{color:#C0392B;font-weight:600}
.switch{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:51px;height:31px;border-radius:999px;background:var(--rule);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--ink)}
.switch:checked::after{transform:translateX(20px)}
.switch:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-color-scheme:dark){.switch:checked::after{background:#121212}}
.quick{display:flex;gap:18px;padding:10px 0 2px}
.quick button{min-height:44px;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.empty{padding:56px 0;text-align:center;color:var(--muted);font:italic 17px/1.5 var(--serif)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="mast">
      <h1>Die Lage</h1>
      <div class="date" id="date"></div>
    </div>
  </div>
  <nav aria-label="Bereiche">
    <button type="button" data-view="topics" aria-current="page">Themen</button>
    <button type="button" data-view="search">Suche</button>
    <button type="button" data-view="latest">Neueste</button>
    <button type="button" data-view="status">Quellen</button>
  </nav>
</header>
<main class="wrap" id="main"><p class="empty">Lade die Lage …</p></main>

<script>
const main = document.getElementById('main');
let SOURCES = {}, RAW = [], TOPICS = [], view = 'topics', inDetail = false, STAND = null;
let OFF = new Set();
try { OFF = new Set(JSON.parse(localStorage.getItem('nl_off') || '[]')); } catch (e) {}
const saveOff = () => { try { localStorage.setItem('nl_off', JSON.stringify([...OFF])); } catch (e) {} };
const active = () => Object.keys(SOURCES).filter(s => !OFF.has(s));
const on = s => !OFF.has(s);

// Themen auf die gewählten Quellen zuschneiden
function applyFilter(raw) {
  return raw.map(t => {
    const articles = t.articles.filter(a => on(a.source));
    const sources = t.sources.filter(on);
    let vergleich = t.vergleich;
    if (vergleich?.perspektiven) {
      vergleich = {...vergleich, perspektiven: vergleich.perspektiven.filter(p => on(p.quelle))};
    }
    const title = articles.some(a => a.title === t.title) ? t.title
      : (articles.find(a => SOURCES[a.source]?.lang === 'de') || articles[0] || {}).title;
    return {...t, title, articles, sources, source_count: sources.length, vergleich,
            latest: articles[0]?.published || t.latest};
  }).filter(t => t.source_count >= 2)
    .sort((a, b) => b.source_count - a.source_count || (b.latest > a.latest ? 1 : -1));
}
const bust = () => '?t=' + Math.floor(Date.now() / 60000);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `vor ${Math.max(m, 1)} Min.`;
  const h = Math.round(m / 60);
  return h < 24 ? `vor ${h} Std.` : `vor ${Math.round(h / 24)} Tg.`;
};
const clock = iso => new Date(iso).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
const total = () => active().length || 1;
const image = t => (t.articles.find(a => a.image) || {});
const img = (src, cls, alt = '') => src
  ? `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
const langs = t => [...new Set(t.sources.map(s => SOURCES[s]?.lang).filter(Boolean))].length > 1;
const cover = t => `<div class="cover" aria-label="${t.source_count} von ${total()} Quellen berichten">
  <div class="bar"><i style="width:${Math.round(t.source_count / total() * 100)}%"></i></div>
  <span>${t.source_count} von ${total()} Quellen</span></div>`;

function setDate() {
  const d = new Date().toLocaleDateString('de-DE', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  document.getElementById('date').textContent = d + (STAND ? ' · Stand ' + clock(STAND) : '');
}
setDate();

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x === b ? x.setAttribute('aria-current', 'page') : x.removeAttribute('aria-current'));
  view = b.dataset.view;
  render();
}));

async function getJSON(name) {
  const r = await fetch(name + bust());
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function render() {
  inDetail = false;
  window.scrollTo(0, 0);
  try {
    if (view === 'topics') await renderTopics();
    else if (view === 'latest') await renderLatest();
    else if (view === 'search') await renderSearch();
    else await renderStatus();
  } catch (e) {
    main.innerHTML = '<p class="empty">Noch keine Ausgabe da. Der erste Lauf bei GitHub dauert ein paar Minuten.</p>';
  }
}

async function renderTopics() {
  const d = await getJSON('topics.json');
  SOURCES = d.sources; RAW = d.topics; STAND = d.stand; setDate();
  TOPICS = applyFilter(RAW);
  if (active().length < 2) { main.innerHTML = '<p class="empty">Wähle unter „Quellen“ mindestens zwei Medien aus.</p>'; return; }
  if (!TOPICS.length) { main.innerHTML = '<p class="empty">Gerade berichten keine zwei deiner Quellen über dasselbe Thema.</p>'; return; }
  const [lead, ...rest] = TOPICS;
  const v = lead.vergleich, pic = image(lead);
  main.innerHTML = `
    <article class="lead">
      ${pic.image ? `<button type="button" onclick="openTopic(0)" style="display:block;width:100%">${img(pic.image, 'photo', lead.title)}</button>
      <div class="credit">Foto: ${esc(pic.source)}</div>` : ''}
      <div class="label">Thema des Tages${langs(lead) ? ' · Deutsch und Englisch' : ''}</div>
      <button type="button" onclick="openTopic(0)"><h2>${esc(lead.title)}</h2></button>
      <p class="summary">${esc(v?.kern || lead.articles[0]?.summary || '')}</p>
      ${cover(lead)}
      ${v?.perspektiven?.length ? `<ul class="related">${v.perspektiven.slice(0, 3).map(p =>
        `<li><span class="src">${esc(p.quelle)}</span><span class="txt">${esc(p.schwerpunkt)}</span></li>`).join('')}</ul>` : ''}
      <button type="button" class="more" onclick="openTopic(0)">Alle ${lead.articles.length} Berichte im Vergleich <span aria-hidden="true">›</span></button>
    </article>
    ${rest.length ? `<div class="sec"><h2>Weitere Themen</h2><span>nach Zahl der Quellen</span></div>` : ''}
    ${rest.map((t, i) => {
      const p = image(t);
      return `<button type="button" class="story" onclick="openTopic(${i + 1})">
        <div class="body">
          <h3>${esc(t.title)}</h3>
          <p>${esc(t.vergleich?.kern || t.articles[0]?.summary || '')}</p>
          <div class="byline"><b>${t.source_count} Quellen</b> · ${ago(t.latest)}${langs(t) ? ' · DE + EN' : ''}</div>
        </div>
        ${img(p.image, 'thumb')}
      </button>`;
    }).join('')}`;
}

// Ein Bericht, der sich antippen und aufklappen lässt
function paragraphs(text) {
  const sents = (text || '').match(/[^.!?]+[.!?]+["“”«»]?\s*|[^.!?]+$/g) || [];
  const out = []; let cur = '';
  for (const s of sents) { cur += s; if (cur.length > 280) { out.push(cur.trim()); cur = ''; } }
  if (cur.trim()) out.push(cur.trim());
  return out.map(x => `<p>${esc(x)}</p>`).join('');
}
function report(a, opts = {}) {
  const text = a.summary || '';
  return `<details class="item">
    <summary class="story">
      ${opts.time ? `<span class="time">${clock(a.published)}</span>` : ''}
      <div class="body">
        ${opts.nosrc ? (opts.tag ? `<div style="margin-bottom:4px"><span class="tag" style="margin-left:0">${esc(opts.tag)}</span></div>` : '')
          : `<div class="label" style="margin-bottom:4px">${esc(a.source)}${opts.tag ? `<span class="tag">${esc(opts.tag)}</span>` : ''}</div>`}
        <h3${opts.time ? ' style="font-size:17px"' : ''}>${esc(a.title)}</h3>
        ${text && !opts.time ? `<p class="clamp">${esc(text)}</p>` : ''}
        <div class="byline">${ago(a.published)}</div>
      </div>
      ${img(a.image, 'thumb')}
      <span class="chev" aria-hidden="true">›</span>
    </summary>
    <div class="expand">
      ${img(a.image, 'photo', a.title)}
      ${text ? paragraphs(text) : '<p class="short">Dieser Feed liefert nur die Überschrift.</p>'}
      ${text && text.length < 300 ? '<p class="short">Mehr liefert der Feed dieses Mediums nicht.</p>' : ''}
      <a class="readon" href="${esc(a.link)}" target="_blank" rel="noopener">Bei ${esc(a.source)} weiterlesen <span aria-hidden="true">↗</span></a>
    </div>
  </details>`;
}

function openTopic(i) {
  inDetail = true;
  const t = TOPICS[i], v = t.vergleich, pic = image(t);
  const missing = active().filter(s => !t.sources.includes(s));
  main.innerHTML = `
    <button type="button" class="back" onclick="render()"><span aria-hidden="true">‹</span> Alle Themen</button>
    <article class="article">
      <div class="label">${t.source_count} von ${total()} Quellen${langs(t) ? ' · Deutsch und Englisch' : ''}</div>
      <h1>${esc(t.title)}</h1>
      ${v?.kern ? `<p class="dek">${esc(v.kern)}</p>` : ''}
      ${pic.image ? `${img(pic.image, 'photo', t.title)}<div class="credit">Foto: ${esc(pic.source)}</div>` : ''}
      ${cover(t)}
      <div class="text">${v ? `
        ${v.perspektiven?.length ? `<h3>So berichten die Medien</h3>${v.perspektiven.map(p =>
          `<p><span class="who">${esc(p.quelle)}</span>${esc(p.schwerpunkt)}</p>`).join('')}` : ''}
        ${v.unterschiede?.length ? `<h3>Wo sie sich unterscheiden</h3><ul>${v.unterschiede.map(u => `<li>${esc(u)}</li>`).join('')}</ul>` : ''}
        ${v.offen ? `<h3>Was offen bleibt</h3><p>${esc(v.offen)}</p>` : ''}
        <div class="pullnote">Vergleich von Claude, nur auf Grundlage von Überschriften und Teasern der Medien.${OFF.size ? ' Der gemeinsame Kern kann auch abgewählte Quellen einbeziehen.' : ''}</div>`
      : `<div class="box">${t.source_count < 3
          ? 'Ein Perspektivvergleich entsteht, sobald mindestens drei Quellen berichten.'
          : 'Der Perspektivvergleich wird beim nächsten Lauf erstellt.'}</div>`}
      </div>
      <div class="sec"><h2>Die Berichte</h2><span>zum Aufklappen antippen</span></div>
      ${t.articles.map(a => report(a)).join('')}
      ${missing.length ? `<div class="sec"><h2>Nicht berichtet</h2><span>oder nicht als Thema erkannt</span></div>
        <p class="missing">${missing.map(esc).join(' · ')}</p>` : ''}
    </article>`;
  window.scrollTo(0, 0);
}

async function renderLatest() {
  const d = await getJSON('latest.json');
  d.articles = d.articles.filter(a => on(a.source));
  if (!d.articles.length) { main.innerHTML = '<p class="empty">Noch keine Meldungen.</p>'; return; }
  main.innerHTML = `<div class="sec"><h2>Neueste Meldungen</h2><span>alle deine Quellen</span></div>` + d.articles.map(a => report(a, {time: true})).join('');
}

async function renderStatus() {
  const [d, tp] = await Promise.all([getJSON('status.json'), getJSON('topics.json').catch(() => null)]);
  if (tp) SOURCES = tp.sources;
  const a = d.abgleich || {};
  const names = Object.keys(d.feeds);
  const group = lang => names.filter(n => (SOURCES[n]?.lang || 'de') === lang);
  const row = n => {
    const s = d.feeds[n] || {}, info = SOURCES[n] || {};
    const detail = s.ok === false ? `<small class="bad">Feed nicht erreichbar</small>`
      : `<small>${esc(info.type || '')}${s.ok ? ` · ${s.count} Meldungen` : ''}</small>`;
    return `<label class="toggle">
      <span><span class="name ${on(n) ? '' : 'off'}">${esc(n)}</span>${detail}</span>
      <input type="checkbox" class="switch" data-src="${esc(n)}" ${on(n) ? 'checked' : ''} aria-label="${esc(n)} anzeigen">
    </label>`;
  };
  const de = group('de'), en = group('en');
  main.innerHTML = `
    <div class="sec"><h2>Deine Quellen</h2><span id="count"></span></div>
    <div class="quick">
      <button type="button" data-all="1">Alle an</button>
      <button type="button" data-all="0">Alle aus</button>
    </div>
    ${de.length ? `<div class="sec"><h2>Deutschsprachig</h2><span>${de.length}</span></div>${de.map(row).join('')}` : ''}
    ${en.length ? `<div class="sec"><h2>International</h2><span>${en.length}</span></div>${en.map(row).join('')}` : ''}
    <div class="sec"><h2>Ausgabe</h2><span>${ago(d.stand)}</span></div>
    <div class="row"><span>Themen-Abgleich</span><span class="${a.aktiv ? 'ok' : 'bad'}">${a.aktiv ? 'nach Bedeutung' : 'nur nach Wörtern'}</span></div>
    <div class="row"><span>Perspektivvergleich</span><span class="${d.vergleich ? 'ok' : 'bad'}">${d.vergleich ? 'aktiv' : 'kein Schlüssel'}</span></div>
    <p class="row" style="border:0;color:var(--muted);font-size:12px">Die Auswahl gilt nur auf diesem Gerät. Gesammelt werden weiterhin alle Quellen, damit du jederzeit umschalten kannst.</p>`;
  const count = () => { document.getElementById('count').textContent = `${names.filter(on).length} von ${names.length} aktiv`; };
  count();
  main.querySelectorAll('.switch').forEach(sw => sw.addEventListener('change', () => {
    const n = sw.dataset.src;
    sw.checked ? OFF.delete(n) : OFF.add(n);
    sw.closest('.toggle').querySelector('.name').classList.toggle('off', !sw.checked);
    saveOff(); count();
  }));
  main.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => {
    const all = b.dataset.all === '1';
    OFF = all ? new Set() : new Set(names);
    main.querySelectorAll('.switch').forEach(sw => {
      sw.checked = all;
      sw.closest('.toggle').querySelector('.name').classList.toggle('off', !all);
    });
    saveOff(); count();
  }));
}

// ---------- Suche ----------
let SEARCH = null, lastQuery = '', searchMode = 'medium';
let history_ = [];
try { history_ = JSON.parse(localStorage.getItem('nl_hist') || '[]'); } catch (e) {}
const norm = s => (s || '').toLowerCase()
  .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
  .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ');

async function loadSearch() {
  if (SEARCH) return SEARCH;
  const d = await getJSON('search.json');
  if (!Object.keys(SOURCES).length) { try { SOURCES = (await getJSON('topics.json')).sources; } catch (e) {} }
  d.a.forEach(a => { a.source = d.q[a.s]; a.hay = ' ' + norm(a.t + ' ' + a.x); a.ht = ' ' + norm(a.t); });
  SEARCH = d;
  return d;
}

function runSearch(q) {
  const words = norm(q).split(' ').filter(w => w.length > 1);
  if (!words.length) return null;
  const A = SEARCH.a;
  const hits = new Map(); // index -> {score, related}
  A.forEach((a, i) => {
    if (!on(a.source)) return;
    let score = 0;
    for (const w of words) {
      if (!a.hay.includes(' ' + w)) return;          // jedes Wort muss vorkommen (Wortanfang)
      score += a.ht.includes(' ' + w) ? 3 : 1;
    }
    hits.set(i, {score, related: false});
  });
  // Ähnliche Meldungen anderer Medien dazunehmen (auch andere Sprache)
  [...hits.keys()].forEach(i => A[i].r.forEach(j => {
    if (!hits.has(j) && on(A[j].source)) hits.set(j, {score: 0.5, related: true});
  }));
  return [...hits.entries()].map(([i, h]) => ({...A[i], ...h}))
    .sort((a, b) => (b.p > a.p ? 1 : -1));
}

function toReport(a) {
  return {source: a.source, title: a.t, summary: a.x, link: a.l, published: a.p, image: a.m};
}

async function renderSearch(q = lastQuery) {
  main.innerHTML = `
    <form class="searchbar" role="search" onsubmit="event.preventDefault(); doSearch(this.q.value)">
      <label for="q" class="sr" style="position:absolute;left:-9999px">Thema suchen</label>
      <input id="q" name="q" type="search" placeholder="Thema, Person, Ort …" value="${esc(q)}" autocomplete="off" enterkeyhint="search">
      <button type="submit">Suchen</button>
    </form>
    <p class="hint">Durchsucht alle Meldungen deiner Quellen der letzten 7 Tage.</p>
    <div id="results"></div>`;
  if (q) return doSearch(q);
  const box = document.getElementById('results');
  box.innerHTML = `
    ${history_.length ? `<div class="sec"><h2>Zuletzt gesucht</h2><span></span></div>
      <div class="chips">${history_.map(h => `<button type="button" data-q="${esc(h)}">${esc(h)}</button>`).join('')}</div>` : ''}`;
  box.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => doSearch(b.dataset.q)));
}

async function doSearch(q) {
  q = (q || '').trim();
  const box = document.getElementById('results');
  const input = document.getElementById('q');
  if (input) { input.value = q; input.blur(); }
  if (!q) { box.innerHTML = '<p class="hint" style="color:#C0392B">Gib einen Suchbegriff ein.</p>'; return; }
  lastQuery = q;
  history_ = [q, ...history_.filter(h => h.toLowerCase() !== q.toLowerCase())].slice(0, 8);
  try { localStorage.setItem('nl_hist', JSON.stringify(history_)); } catch (e) {}
  box.innerHTML = '<p class="empty">Suche läuft …</p>';
  try { await loadSearch(); } catch (e) { box.innerHTML = '<p class="empty">Der Suchindex ist noch nicht da. Er entsteht beim nächsten Lauf.</p>'; return; }
  const res = runSearch(q);
  if (!res || !res.length) { box.innerHTML = `<p class="empty">Keine Meldungen zu „${esc(q)}“ in den letzten 7 Tagen.</p>`; return; }

  const bySrc = {};
  res.forEach(a => (bySrc[a.source] ||= []).push(a));
  const order = Object.keys(bySrc).sort((a, b) => bySrc[b].length - bySrc[a].length);
  const silent = active().filter(s => !bySrc[s]);
  const direct = res.filter(a => !a.related).length;
  const days = Math.max(1, Math.round((Date.now() - new Date(res[res.length - 1].p)) / 864e5));

  // Gehört ein Treffer zu einem aktuellen Thema?
  let topicHtml = '';
  try {
    if (!TOPICS.length) { const d = await getJSON('topics.json'); SOURCES = d.sources; RAW = d.topics; TOPICS = applyFilter(RAW); }
    const ids = new Set(res.map(a => a.i));
    const ti = TOPICS.findIndex(t => t.articles.some(a => ids.has(a.id)));
    if (ti >= 0) topicHtml = `<button type="button" class="topiclink" onclick="openTopic(${ti})">
      <span class="label">Aktuelles Thema mit Perspektivvergleich ›</span><b>${esc(TOPICS[ti].title)}</b></button>`;
  } catch (e) {}

  const item = (a, nosrc) => report(toReport(a), {tag: a.related ? 'ähnlich' : '', nosrc});
  const byMedium = order.map(s => {
    const list = bySrc[s];
    return `<div class="outlet"><h3>${esc(s)}</h3><span>${list.length} ${list.length === 1 ? 'Meldung' : 'Meldungen'}</span></div>
      ${list.slice(0, 3).map(a => item(a, true)).join('')}
      ${list.length > 3 ? `<div class="hidden" hidden>${list.slice(3).map(a => item(a, true)).join('')}</div>
        <button type="button" class="morebtn" onclick="this.previousElementSibling.hidden=false;this.remove()">${list.length - 3} weitere von ${esc(s)}</button>` : ''}`;
  }).join('');
  const chrono = res.map(a => item(a, false)).join('');

  box.innerHTML = `
    <div class="summarybox">
      <p class="big">${res.length} Meldungen in ${order.length} von ${active().length} Quellen</p>
      <div class="meta">${direct} direkte Treffer${res.length > direct ? `, ${res.length - direct} inhaltlich ähnliche (auch andere Sprachen)` : ''} · ${days === 1 ? 'seit gestern' : `über ${days} Tage`}</div>
      <div class="cover"><div class="bar"><i style="width:${Math.round(order.length / active().length * 100)}%"></i></div><span>${order.length} von ${active().length} Quellen</span></div>
    </div>
    ${topicHtml}
    <div class="seg" role="group" aria-label="Sortierung">
      <button type="button" data-mode="medium" aria-pressed="${searchMode === 'medium'}">Nach Medium</button>
      <button type="button" data-mode="zeit" aria-pressed="${searchMode === 'zeit'}">Chronologisch</button>
    </div>
    <div id="list">${searchMode === 'medium' ? byMedium : `<div style="margin-top:8px">${chrono}</div>`}</div>
    ${silent.length ? `<div class="sec"><h2>Nichts gefunden bei</h2><span>${silent.length} Quellen</span></div>
      <p class="missing">${silent.map(esc).join(' · ')}</p>` : ''}`;
  box.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    searchMode = b.dataset.mode;
    box.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.getElementById('list').innerHTML = searchMode === 'medium' ? byMedium : `<div style="margin-top:8px">${chrono}</div>`;
  }));
}

render();
document.addEventListener('visibilitychange', () => { if (!document.hidden && !inDetail && view !== 'search') render(); });
</script>
</body>
</html>
