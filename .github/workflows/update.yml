name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "7,27,47 * * * *"   # alle 20 Minuten (GitHub startet manchmal etwas später)
  workflow_dispatch:             # "Run workflow"-Knopf zum manuellen Starten
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nachrichtenlage
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NL_MODEL_CACHE: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Sprachmodell aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-paraphrase-multilingual-v1

      - name: Bisherige Meldungen laden
        uses: actions/cache/restore@v4
        with:
          path: data
          key: lage-data-${{ github.run_id }}
          restore-keys: lage-data-

      - name: Feeds holen, Themen bilden, Seite bauen
        run: python build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HENDRIK_API_KEY }}

      - name: Meldungen für den nächsten Lauf sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: lage-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
